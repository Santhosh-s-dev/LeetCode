# CI for a plain collection of standalone LeetCode solution files.
# This repo has no build tool (no pom.xml / no Maven project), so
# instead of running Maven, this workflow simply compiles every
# .java file to catch syntax errors on push/PR.

name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Compile all Java solutions
      run: |
        set -e
        mkdir -p out
        find . -name "*.java" -print0 | xargs -0 --no-run-if-empty javac -d out
